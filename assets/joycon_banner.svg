<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7764d8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#00d2be" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ff3c28" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7764d8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="joyconLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <linearGradient id="joyconRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7764d8"/>
      <stop offset="100%" stop-color="#9d8df1"/>
    </linearGradient>

    <radialGradient id="ambientGlow1" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientGlow2" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7764d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7764d8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00d2be" flood-opacity="0.6"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#7764d8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif; font-weight: 500; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif; font-weight: 700; fill: #ffffff; font-size: 15px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 12px; line-height: 1.4; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif; font-weight: 600; font-size: 11px; }
    .code-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #38bdf8; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="480" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Ambient Glow Circles -->
  <circle cx="220" cy="240" r="220" fill="url(#ambientGlow1)"/>
  <circle cx="750" cy="180" r="260" fill="url(#ambientGlow2)"/>

  <!-- Subtle Tech Grid Lines -->
  <path d="M 0 120 L 1000 120 M 0 240 L 1000 240 M 0 360 L 1000 360" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,8"/>
  <path d="M 320 0 L 320 480 M 640 0 L 640 480" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,8"/>

  <!-- ==================== LEFT: JOY-CON VECTOR CONTROLLER ==================== -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Wireless Waves -->
    <path d="M 175 140 A 55 55 0 0 1 175 220" fill="none" stroke="#00d2be" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 190 125 A 75 75 0 0 1 190 235" fill="none" stroke="#00d2be" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 205 110 A 95 95 0 0 1 205 250" fill="none" stroke="#00d2be" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="url(#glowCyan)"/>

    <!-- Joy-Con Left Body (Curved Ergonomic Shell) -->
    <path d="M 30 15 
             C 75 15, 120 20, 135 45 
             C 142 60, 142 300, 135 315 
             C 120 340, 75 345, 30 345 
             C 18 345, 15 330, 15 300 
             L 15 60 
             C 15 30, 18 15, 30 15 Z" 
          fill="url(#joyconLeft)" stroke="#023e8a" stroke-width="2"/>

    <!-- Left Rail / Edge Accent -->
    <path d="M 15 50 L 15 310" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <!-- Rail SL / SR Buttons -->
    <rect x="13" y="125" width="4" height="26" rx="2" fill="#0f172a"/>
    <rect x="13" y="210" width="4" height="26" rx="2" fill="#0f172a"/>
    <!-- LED Indicators (Player 1) -->
    <circle cx="15" cy="165" r="2.5" fill="#00ffcc" filter="url(#glowCyan)"/>
    <circle cx="15" cy="177" r="2" fill="#1e293b"/>
    <circle cx="15" cy="189" r="2" fill="#1e293b"/>
    <circle cx="15" cy="201" r="2" fill="#1e293b"/>

    <!-- Top Left Minus Button -->
    <rect x="95" y="42" width="16" height="5" rx="2.5" fill="#1e293b"/>

    <!-- Analog Thumbstick with Directional Ridge -->
    <g transform="translate(68, 110)">
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" fill="#1e293b"/>
      <!-- Thumbstick center cap & grip ridges -->
      <circle cx="0" cy="0" r="16" fill="#0f172a"/>
      <circle cx="0" cy="-9" r="2.5" fill="#38bdf8"/>
      <circle cx="0" cy="9" r="2.5" fill="#38bdf8"/>
      <circle cx="-9" cy="0" r="2.5" fill="#38bdf8"/>
      <circle cx="9" cy="0" r="2.5" fill="#38bdf8"/>
    </g>

    <!-- Directional Buttons (D-Pad / Arrows) -->
    <g transform="translate(68, 225)">
      <!-- Up -->
      <circle cx="0" cy="-28" r="11" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <path d="M -3 -26 L 0 -31 L 3 -26 Z" fill="#94a3b8"/>
      <!-- Down -->
      <circle cx="0" cy="28" r="11" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <path d="M -3 26 L 0 31 L 3 26 Z" fill="#94a3b8"/>
      <!-- Left -->
      <circle cx="-28" cy="0" r="11" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <path d="M -26 -3 L -31 0 L -26 3 Z" fill="#94a3b8"/>
      <!-- Right -->
      <circle cx="28" cy="0" r="11" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <path d="M 26 -3 L 31 0 L 26 3 Z" fill="#94a3b8"/>
    </g>

    <!-- Capture / Screenshot Button -->
    <rect x="78" y="285" width="14" height="14" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="85" cy="292" r="3.5" fill="#38bdf8"/>

    <!-- Virtual Desktop Pointer (Targeting cursor) -->
    <g transform="translate(195, 175)" filter="url(#shadow)">
      <path d="M 0 0 L 16 38 L 24 24 L 38 16 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
      <circle cx="28" cy="28" r="18" fill="none" stroke="#7764d8" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>
    </g>
  </g>

  <!-- ==================== CENTER-RIGHT: HERO TEXT & BADGES ==================== -->
  <g transform="translate(320, 48)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="190" height="24" rx="12" fill="#7764d8" fill-opacity="0.2" stroke="#7764d8" stroke-width="1"/>
    <text x="95" y="16" class="badge-text" fill="#a78bfa" text-anchor="middle">LINUX KERNEL UINPUT &amp; EVDEV</text>

    <!-- Main Title -->
    <text x="0" y="62" class="title" font-size="34" letter-spacing="-0.5">Joy-Con Mouse &amp; Remote</text>
    <text x="0" y="90" class="subtitle" font-size="14">High-performance wireless cursor, couch media remote, and shell companion</text>

    <!-- Mode Cards Grid (3 Horizontal Modules) -->
    <!-- Card 1: Air Mouse -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="195" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="34" height="34" rx="8" fill="#00b4d8" fill-opacity="0.2"/>
      <text x="29" y="34" font-size="18" text-anchor="middle">🖱️</text>
      <text x="56" y="28" class="card-title">Air Mouse</text>
      <text x="56" y="42" class="code-text">modes/air_mouse.py</text>

      <text x="14" y="72" class="card-desc">• Precision <tspan fill="#38bdf8">x^1.6</tspan> curve</text>
      <text x="14" y="92" class="card-desc">• Hardware zero drift filter</text>
      <text x="14" y="112" class="card-desc">• Drag, drop &amp; double-click</text>
      <text x="14" y="132" class="card-desc">• Side-rail tab navigation</text>
      <text x="14" y="152" class="card-desc">• Wayland &amp; X11 native</text>
    </g>

    <!-- Card 2: Media Remote -->
    <g transform="translate(210, 115)">
      <rect x="0" y="0" width="195" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="34" height="34" rx="8" fill="#ff4d4d" fill-opacity="0.2"/>
      <text x="29" y="34" font-size="18" text-anchor="middle">📺</text>
      <text x="56" y="28" class="card-title">Media Remote</text>
      <text x="56" y="42" class="code-text">modes/media_remote.py</text>

      <text x="14" y="72" class="card-desc">• Side-rail volume <tspan fill="#f87171">(SL/SR)</tspan></text>
      <text x="14" y="92" class="card-desc">• Continuous seek <tspan fill="#f87171">(±5s)</tspan></text>
      <text x="14" y="112" class="card-desc">• Subtitle toggle <tspan fill="#f87171">('C')</tspan></text>
      <text x="14" y="132" class="card-desc">• Instant 10s skip backwards</text>
      <text x="14" y="152" class="card-desc">• Fullscreen toggle &amp; mute</text>
    </g>

    <!-- Card 3: Terminal Controller -->
    <g transform="translate(420, 115)">
      <rect x="0" y="0" width="195" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="34" height="34" rx="8" fill="#7764d8" fill-opacity="0.2"/>
      <text x="29" y="34" font-size="18" text-anchor="middle">💻</text>
      <text x="56" y="28" class="card-title">Terminal Shell</text>
      <text x="56" y="42" class="code-text">modes/terminal.py</text>

      <text x="14" y="72" class="card-desc">• Hands-free AI pair coding</text>
      <text x="14" y="92" class="card-desc">• Trigger Enter &amp; Tab complete</text>
      <text x="14" y="112" class="card-desc">• History Up/Down navigation</text>
      <text x="14" y="132" class="card-desc">• Esc &amp; <tspan fill="#c084fc">Ctrl+C</tspan> signal interrupt</text>
      <text x="14" y="152" class="card-desc">• Analog stick buffer scroll</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SPECS & HIGHLIGHTS BAR ==================== -->
  <g transform="translate(60, 395)">
    <!-- Container pill -->
    <rect x="0" y="0" width="880" height="48" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Spec 1: Zero Dependencies -->
    <g transform="translate(25, 14)">
      <circle cx="10" cy="10" r="9" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 6 10 L 9 13 L 14 7" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <text x="26" y="14" class="badge-text" fill="#f1f5f9">Zero Dependencies</text>
      <text x="26" y="24" font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">100% Python Stdlib</text>
    </g>

    <!-- Spec 2: Wayland + X11 -->
    <g transform="translate(205, 14)">
      <circle cx="10" cy="10" r="9" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="10" y="14" font-size="11" text-anchor="middle">🐧</text>
      <text x="26" y="14" class="badge-text" fill="#f1f5f9">Wayland &amp; X11</text>
      <text x="26" y="24" font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">Direct /dev/uinput</text>
    </g>

    <!-- Spec 3: 250Hz Polling -->
    <g transform="translate(370, 14)">
      <circle cx="10" cy="10" r="9" fill="#f59e0b" fill-opacity="0.2"/>
      <path d="M 10 4 L 7 11 L 11 11 L 9 16 L 14 9 L 10 9 Z" fill="#f59e0b"/>
      <text x="26" y="14" class="badge-text" fill="#f1f5f9">250Hz Polling Rate</text>
      <text x="26" y="24" font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">&lt;4ms Input Latency</text>
    </g>

    <!-- Spec 4: Haptic Rumble -->
    <g transform="translate(545, 14)">
      <circle cx="10" cy="10" r="9" fill="#a855f7" fill-opacity="0.2"/>
      <text x="10" y="14" font-size="11" text-anchor="middle">📳</text>
      <text x="26" y="14" class="badge-text" fill="#f1f5f9">Haptic Rumble</text>
      <text x="26" y="24" font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">Physical Force Feedback</text>
    </g>

    <!-- Spec 5: Auto-Dormant -->
    <g transform="translate(715, 14)">
      <circle cx="10" cy="10" r="9" fill="#ec4899" fill-opacity="0.2"/>
      <text x="10" y="14" font-size="11" text-anchor="middle">🎮</text>
      <text x="26" y="14" class="badge-text" fill="#f1f5f9">Auto-Dormant</text>
      <text x="26" y="24" font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">Releases Grab for Steam</text>
    </g>
  </g>
</svg>
