name: CI (Windows Branch)

on:
  push:
    branches: [ windows ]
  pull_request:
    branches: [ windows ]
  workflow_dispatch:

jobs:
  validate:
    name: Test & Validate Windows Suite (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python Compilation (Zero Syntax Errors)
        run: |
          python -m py_compile joycon-mouse-windows.py joycon-mouse.py test_buttons.py

      - name: Test CLI Interface & Mode Validation
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python joycon-mouse.py --help
          python joycon-mouse.py --list-modes
          python joycon-mouse.py --list-mappings
