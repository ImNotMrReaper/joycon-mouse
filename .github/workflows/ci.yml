name: CI (macOS Branch)

on:
  push:
    branches: [ macos ]
  pull_request:
    branches: [ macos ]
  workflow_dispatch:

jobs:
  validate:
    name: Test & Validate macOS Suite (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python Compilation (Zero Syntax Errors)
        run: |
          python -m py_compile joycon-mouse-macos.py joycon-mouse.py
          python -m py_compile modes/*.py
          python -m py_compile custom_modes/*.py

      - name: Test Standalone Mode Execution
        run: |
          python modes/air_mouse.py
          python modes/media_remote.py
          python modes/terminal.py
          python custom_modes/presentation.py
          python custom_modes/gaming_hotkeys.py

      - name: Validate Shell Script Syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n run_macos.command
