name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python Compilation (Zero Syntax Errors)
        run: |
          python -m py_compile joycon-mouse.py setup_wizard.py test_buttons.py
          python -m py_compile modes/*.py
          python -m py_compile custom_modes/*.py

      - name: Test CLI Mode Discovery Engine
        run: |
          python joycon-mouse.py --list-modes

      - name: Test Standalone Mode Execution
        run: |
          python modes/air_mouse.py
          python modes/media_remote.py
          python modes/terminal.py
          python custom_modes/presentation.py
          python custom_modes/gaming_hotkeys.py

      - name: Validate Shell Script Syntax
        run: |
          bash -n install.sh
          bash -n setup.sh
          bash -n uninstall.sh
