name: CI (Windows Branch)

on:
  push:
    branches: [ windows ]
  pull_request:
    branches: [ windows ]
  workflow_dispatch:

jobs:
  validate:
    name: Test & Validate Windows Suite (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python Compilation (Zero Syntax Errors)
        run: |
          python -m py_compile joycon-mouse-windows.py joycon-mouse.py
          python -m compileall modes custom_modes

      - name: Test Standalone Mode Execution
        run: |
          python modes/air_mouse.py
          python modes/media_remote.py
          python modes/terminal.py
          python custom_modes/presentation.py
          python custom_modes/gaming_hotkeys.py
